#:schema https://mise.jdx.dev/schema/mise.json
#
# wytchr toolchain + task runner.
#
# Pins the tools the dev loop needs so a fresh clone gets the same Python and
# the same pitchfork as everyone else. The daemons themselves still live in
# pitchfork.toml — this file just wraps the commands you actually type.
#
#   mise install          # get the toolchain
#   mise run dev          # bring up postgres + valkey + the app
#   mise run test         # functional + visual suite (needs `mise run dev` first)
#   mise run test:visual  # just the Playwright tests (screenshots in .preview/playwright)
#   mise run lint         # ruff check the Python sources + the shell buildfile
#   mise run shots        # render every template and screenshot it at 4 widths
#
# The software factory (kjaymiller/factory) runs `test` and `lint` as its gates
# inside a workcell that has DATABASE_URL/VALKEY_URL set and no Docker, so both
# must run with nothing but `uv`.

[tools]
python = "3.13"
uv = "latest"
"aqua:jdx/pitchfork" = "latest"

[tasks.dev]
description = "start the local stack (postgres + valkey + app on :5050)"
run = "pitchfork start --group wytchr"

[tasks.logs]
description = "tail the app log"
run = "pitchfork logs -f web"

[tasks.stop]
description = "tear the local stack down"
run = "pitchfork stop --group wytchr"

[tasks.test]
description = "run the functional and visual suites against the local dev postgres"
run = "uv run pytest {{arg(name='args', var=true, default='')}}"

[tasks."test:visual"]
description = "Playwright: every page at 4 widths, overflow + console checks, PNGs in .preview/playwright"
run = "uv run pytest -m visual {{arg(name='args', var=true, default='')}}"

[tasks."playwright:install"]
description = "one-time: download the Chromium the visual tests drive"
run = "uv run playwright install chromium"

[tasks.lint]
description = "ruff check the Python sources, and check the shell buildfile parses"
run = [
  "uv run ruff check .",
  "sh -n factory/visual.sh",
]

[tasks.seed]
description = "WIPE the dev database and load the demo data the screenshots use"
run = "uv run python scripts/seed_fixtures.py"

[tasks.shots]
description = "render every template with fixture data and screenshot it at phone/tablet/desktop widths"
run = "uv run python scripts/preview.py --shots"

[tasks.preview]
description = "render every template with fixture data and serve it on :8899 (no database needed)"
run = "uv run python scripts/preview.py --serve"
