<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wytchr · sign in</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    /* Page-specific. Tokens and reset: /static/app.css */
    body { min-height: 100svh; display: grid; place-items: center; padding: 1rem; }
    form {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 1.5rem; width: 100%; max-width: 22rem;
      display: flex; flex-direction: column; gap: .75rem;
    }
    h1 { margin: 0 0 .25rem 0; font-size: 1.05rem; letter-spacing: .02em; }
    input { background: var(--bg-deep); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: .5rem .65rem; font: inherit; }
    input:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: .55rem; font: inherit; font-weight: 600; cursor: pointer; transition: background .12s; }
    button:hover { background: var(--accent-bright); }
    .err { color: var(--danger); font-size: .85rem; }
    .hint { color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>wytchr</h1>
    <span class="hint">paste API_TOKEN</span>
    <input type="password" name="token" autofocus required>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">sign in</button>
  </form>
  <div class="version-stamp">v{{ app_version }}</div>
</body>
</html>
