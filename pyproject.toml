[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wytchr"
version = "0.1.0"
authors = [{ name = "Jay Miller", email = "kjaymiller@gmail.com" }]
description = "a youtube-channel-manager"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/wytchr"
"Bug Tracker" = "https://github.com/yourusername/wytchr/issues"
