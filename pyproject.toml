[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "wytchr"
version = "0.1.0"
description = "a youtube-channel-manager"
readme = "README.md"
authors = [
    { name = "Jay Miller", email = "kjaymiller@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "quart==0.20.*",
    "hypercorn==0.17.*",
    "apscheduler==3.*",
    "httpx==0.28.*",
    "psycopg[binary]==3.*",
    "valkey==6.*"
]

[project.optional-dependencies]
develop = [
    "pytest==8.*",
    "pytest-asyncio==1.*",
    "playwright==1.*",
    "ruff==0.*"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]

[tool.ruff]
# Pin ruff's long-standing default rule set explicitly: recent ruff releases
# widened the implicit default, and this repo wants the stable core checks
# (pycodestyle E4/E7/E9 + pyflakes F) so `mise run lint` stays reproducible.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
